<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-label="Vista lógica en capas: presentación, puente IPC, servicios, dominio e importación, y datos SQLite; el cliente móvil sale por HTTP a Phoenix Mobile." font-family="Archivo, Segoe UI, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#515C77"/></marker>
    <marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#DE762E"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="510" fill="#FFFFFF"/>
  <g font-size="12" text-anchor="middle" fill="#16203A">

  <!-- Capa 1 -->
  <rect x="20" y="20" width="960" height="100" rx="8" fill="#F4F5F9" stroke="#C9CFDC"/>
  <text x="30" y="58" text-anchor="start" font-size="14" font-weight="700">Presentación</text>
  <text x="30" y="76" text-anchor="start" font-size="11" fill="#515C77">src/renderer (Chromium)</text>
  <g fill="#FFFFFF" stroke="#515C77">
    <rect x="190" y="32" width="150" height="34" rx="5"/><rect x="350" y="32" width="150" height="34" rx="5"/><rect x="510" y="32" width="150" height="34" rx="5"/><rect x="670" y="32" width="150" height="34" rx="5"/><rect x="830" y="32" width="150" height="34" rx="5"/>
    <rect x="190" y="76" width="150" height="34" rx="5"/><rect x="350" y="76" width="150" height="34" rx="5"/><rect x="510" y="76" width="150" height="34" rx="5"/><rect x="670" y="76" width="150" height="34" rx="5"/>
  </g>
  <rect x="830" y="76" width="150" height="34" rx="5" fill="#FCEBDD" stroke="#DE762E" stroke-width="1.5"/>
  <text x="265" y="53">app.ts (sesión, menú)</text><text x="425" y="53">vista-dashboard</text><text x="585" y="53">vista-clientes</text><text x="745" y="53">vista-importar</text><text x="905" y="53">vista-cola</text>
  <text x="265" y="97">vista-telefono</text><text x="425" y="97">vista-reportes</text><text x="585" y="97">vista-recordatorios</text><text x="745" y="97">vista-config</text><text x="905" y="97" font-weight="700">api.ts</text>

  <!-- Capa 2 -->
  <rect x="20" y="140" width="960" height="64" rx="8" fill="#F4F5F9" stroke="#C9CFDC"/>
  <text x="30" y="168" text-anchor="start" font-size="14" font-weight="700">Puente IPC</text>
  <text x="30" y="186" text-anchor="start" font-size="11" fill="#515C77">preload · src/ipc</text>
  <g fill="#FFFFFF" stroke="#515C77"><rect x="190" y="150" width="256" height="44" rx="5"/><rect x="457" y="150" width="256" height="44" rx="5"/></g>
  <rect x="724" y="150" width="256" height="44" rx="5" fill="#FCEBDD" stroke="#DE762E" stroke-width="1.5"/>
  <text x="318" y="168" font-weight="700">preload.ts</text><text x="318" y="185" font-size="11" fill="#515C77">phoenixAPI.invocar · lista blanca</text>
  <text x="585" y="168" font-weight="700">manejadoresIpc.ts</text><text x="585" y="185" font-size="11" fill="#515C77">ipcMain.handle · diálogos · PDF</text>
  <text x="852" y="168" font-weight="700">rutas.ts</text><text x="852" y="185" font-size="11" fill="#515C77">51 canales · exige sesión</text>

  <!-- Capa 3 -->
  <rect x="20" y="224" width="960" height="100" rx="8" fill="#F4F5F9" stroke="#C9CFDC"/>
  <text x="30" y="262" text-anchor="start" font-size="14" font-weight="700">Servicios</text>
  <text x="30" y="280" text-anchor="start" font-size="11" fill="#515C77">src/servicios (negocio)</text>
  <g fill="#FFFFFF" stroke="#515C77">
    <rect x="190" y="236" width="150" height="34" rx="5"/><rect x="350" y="236" width="150" height="34" rx="5"/><rect x="510" y="236" width="150" height="34" rx="5"/><rect x="670" y="236" width="150" height="34" rx="5"/><rect x="830" y="236" width="150" height="34" rx="5"/>
    <rect x="190" y="280" width="150" height="34" rx="5"/><rect x="670" y="280" width="150" height="34" rx="5"/><rect x="830" y="280" width="150" height="34" rx="5"/>
  </g>
  <g fill="#FCEBDD" stroke="#DE762E" stroke-width="1.5"><rect x="350" y="280" width="150" height="34" rx="5"/><rect x="510" y="280" width="150" height="34" rx="5"/></g>
  <text x="265" y="257">servicioAuth</text><text x="425" y="257">servicioPeriodos</text><text x="585" y="257">servicioCartera</text><text x="745" y="257">servicioDashboard</text><text x="905" y="257">servicioReportes</text>
  <text x="265" y="301">servicioExportacion</text><text x="425" y="301">servicioColaLlamadas</text><text x="585" y="301">servicioMovil</text><text x="745" y="301">servicioRecordatorios</text><text x="905" y="301">servicioConfiguracion</text>

  <!-- Capa 4 -->
  <rect x="20" y="344" width="960" height="64" rx="8" fill="#F4F5F9" stroke="#C9CFDC"/>
  <text x="30" y="372" text-anchor="start" font-size="14" font-weight="700">Dominio e</text>
  <text x="30" y="390" text-anchor="start" font-size="14" font-weight="700">importación</text>
  <g fill="#FFFFFF" stroke="#515C77"><rect x="190" y="354" width="200" height="44" rx="5"/><rect x="400" y="354" width="380" height="44" rx="5"/></g>
  <rect x="790" y="354" width="190" height="44" rx="5" fill="#FCEBDD" stroke="#DE762E" stroke-width="1.5"/>
  <text x="290" y="372" font-weight="700">dominio/</text><text x="290" y="389" font-size="11" fill="#515C77">12 estados · prioridad 0–100</text>
  <text x="590" y="372" font-weight="700">importacion/ (ETL)</text><text x="590" y="389" font-size="11" fill="#515C77">lector · mapeo · normalizador · validador · importador</text>
  <text x="885" y="372" font-weight="700">movil/clienteMovil.ts</text><text x="885" y="389" font-size="11" fill="#515C77">cliente HTTP</text>

  <!-- Capa 5 -->
  <rect x="20" y="428" width="760" height="64" rx="8" fill="#F4F5F9" stroke="#C9CFDC"/>
  <text x="30" y="456" text-anchor="start" font-size="14" font-weight="700">Datos</text>
  <text x="30" y="474" text-anchor="start" font-size="11" fill="#515C77">src/db</text>
  <g fill="#FFFFFF" stroke="#515C77"><rect x="190" y="438" width="280" height="44" rx="5"/></g>
  <rect x="490" y="438" width="280" height="44" rx="5" fill="#EEF0F5" stroke="#16203A"/>
  <text x="330" y="456" font-weight="700">conexion · migraciones · schema.sql</text><text x="330" y="473" font-size="11" fill="#515C77">esquema versión 4</text>
  <text x="630" y="456" font-weight="700">SQLite (better-sqlite3)</text><text x="630" y="473" font-size="11" fill="#515C77">17 tablas · carterax_fusion.db</text>
  <line x1="470" y1="460" x2="487" y2="460" stroke="#515C77" stroke-width="1.4" marker-end="url(#f)"/>

  <!-- Externo -->
  <rect x="790" y="438" width="190" height="44" rx="5" fill="#172039"/>
  <text x="885" y="456" font-weight="700" fill="#FFFFFF">Phoenix Mobile</text><text x="885" y="473" font-size="11" fill="#FCEBDD">HTTP :8765 (externo)</text>
  <line x1="885" y1="398" x2="885" y2="435" stroke="#DE762E" stroke-width="1.8" marker-end="url(#fn)"/>
  </g>

  <!-- Flechas entre capas -->
  <g stroke="#515C77" stroke-width="1.4">
    <line x1="160" y1="120" x2="160" y2="137" marker-end="url(#f)"/>
    <line x1="160" y1="204" x2="160" y2="221" marker-end="url(#f)"/>
    <line x1="160" y1="324" x2="160" y2="341" marker-end="url(#f)"/>
    <line x1="160" y1="408" x2="160" y2="425" marker-end="url(#f)"/>
  </g>
  <g font-size="10.5" fill="#515C77" font-family="Archivo, Segoe UI, sans-serif">
    <text x="166" y="133">invoke</text><text x="166" y="217">llama</text><text x="166" y="337">usa</text><text x="166" y="421">SQL</text>
  </g>
</svg>
