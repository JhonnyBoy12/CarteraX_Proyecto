<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" role="img" aria-label="Diagrama de casos de uso: el ejecutivo participa en nueve casos de uso; Phoenix Mobile participa en la cola de llamadas y la llamada manual." font-family="Archivo, Segoe UI, sans-serif">
  <rect x="0" y="0" width="1060" height="640" fill="#FFFFFF"/>
  <rect x="230" y="20" width="620" height="600" rx="12" fill="#FBFBFD" stroke="#515C77" stroke-width="1"/>
  <text x="250" y="46" font-size="14" font-weight="700" fill="#16203A">Sistema: CarteraX Phoenix</text>

  <!-- Actor ejecutivo -->
  <g stroke="#16203A" stroke-width="2" fill="none">
    <circle cx="110" cy="282" r="15"/>
    <line x1="110" y1="297" x2="110" y2="342"/>
    <line x1="80" y1="314" x2="140" y2="314"/>
    <line x1="110" y1="342" x2="86" y2="374"/>
    <line x1="110" y1="342" x2="134" y2="374"/>
  </g>
  <text x="110" y="398" text-anchor="middle" font-size="14" font-weight="600" fill="#16203A">Ejecutivo de cobranza</text>

  <!-- Actor Phoenix Mobile -->
  <rect x="900" y="300" width="140" height="64" rx="8" fill="#172039"/>
  <text x="970" y="324" text-anchor="middle" font-size="11.5" fill="#FCEBDD">«sistema externo»</text>
  <text x="970" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Phoenix Mobile</text>

  <!-- Asociaciones ejecutivo -->
  <g stroke="#515C77" stroke-width="1">
    <line x1="142" y1="318" x2="350" y2="90"/>
    <line x1="142" y1="318" x2="350" y2="148"/>
    <line x1="142" y1="318" x2="350" y2="206"/>
    <line x1="142" y1="318" x2="350" y2="264"/>
    <line x1="142" y1="318" x2="350" y2="322"/>
    <line x1="142" y1="318" x2="350" y2="380"/>
    <line x1="142" y1="318" x2="350" y2="438"/>
    <line x1="142" y1="318" x2="350" y2="496"/>
    <line x1="142" y1="318" x2="350" y2="554"/>
  </g>
  <!-- Asociaciones Phoenix Mobile -->
  <g stroke="#DE762E" stroke-width="1.6">
    <line x1="730" y1="322" x2="900" y2="326"/>
    <line x1="730" y1="380" x2="900" y2="340"/>
  </g>

  <!-- Casos de uso -->
  <g font-size="13.5" text-anchor="middle">
    <ellipse cx="540" cy="90" rx="190" ry="24" fill="#FFFFFF" stroke="#16203A"/>
    <text x="540" y="95" fill="#16203A"><tspan font-weight="700">CU-01</tspan> Iniciar sesión y elegir mes</text>
    <ellipse cx="540" cy="148" rx="190" ry="24" fill="#FFFFFF" stroke="#16203A"/>
    <text x="540" y="153" fill="#16203A"><tspan font-weight="700">CU-02</tspan> Importar cartera mensual</text>
    <ellipse cx="540" cy="206" rx="190" ry="24" fill="#FFFFFF" stroke="#16203A"/>
    <text x="540" y="211" fill="#16203A"><tspan font-weight="700">CU-03</tspan> Consultar dashboard y alertas</text>
    <ellipse cx="540" cy="264" rx="190" ry="24" fill="#FFFFFF" stroke="#16203A"/>
    <text x="540" y="269" fill="#16203A"><tspan font-weight="700">CU-04</tspan> Buscar y gestionar cliente</text>
    <ellipse cx="540" cy="322" rx="190" ry="24" fill="#FCEBDD" stroke="#DE762E" stroke-width="1.6"/>
    <text x="540" y="327" fill="#16203A"><tspan font-weight="700">CU-05</tspan> Ejecutar cola de llamadas</text>
    <ellipse cx="540" cy="380" rx="190" ry="24" fill="#FCEBDD" stroke="#DE762E" stroke-width="1.6"/>
    <text x="540" y="385" fill="#16203A"><tspan font-weight="700">CU-06</tspan> Llamar manualmente</text>
    <ellipse cx="540" cy="438" rx="190" ry="24" fill="#FFFFFF" stroke="#16203A"/>
    <text x="540" y="443" fill="#16203A"><tspan font-weight="700">CU-07</tspan> Atender recordatorios</text>
    <ellipse cx="540" cy="496" rx="190" ry="24" fill="#FFFFFF" stroke="#16203A"/>
    <text x="540" y="501" fill="#16203A"><tspan font-weight="700">CU-08</tspan> Generar y descargar reportes</text>
    <ellipse cx="540" cy="554" rx="190" ry="24" fill="#FFFFFF" stroke="#16203A"/>
    <text x="540" y="559" fill="#16203A"><tspan font-weight="700">CU-09</tspan> Configurar y respaldar</text>
  </g>
</svg>
