<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="Vista de desarrollo: paquetes del repositorio con su tamaño, y la cadena de construcción: TypeScript a dist con tsc, instaladores con electron-builder, APK con Gradle, pruebas sobre dist y GitHub Actions que orquesta todo." font-family="Archivo, Segoe UI, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#515C77"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="460" fill="#FFFFFF"/>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#16203A">Paquetes del repositorio</text>
  <text x="450" y="28" font-size="14" font-weight="700" fill="#16203A">Construcción y distribución</text>

  <g font-size="12" fill="#16203A">
    <g fill="#FCEBDD" stroke="#DE762E" stroke-width="1.2">
      <rect x="20" y="44" width="380" height="34" rx="5"/><rect x="20" y="84" width="380" height="34" rx="5"/><rect x="20" y="124" width="380" height="34" rx="5"/><rect x="20" y="164" width="380" height="34" rx="5"/><rect x="20" y="204" width="380" height="34" rx="5"/><rect x="20" y="244" width="380" height="34" rx="5"/>
    </g>
    <g fill="#EEF0F5" stroke="#515C77"><rect x="20" y="284" width="380" height="34" rx="5"/><rect x="20" y="324" width="380" height="34" rx="5"/><rect x="20" y="364" width="380" height="34" rx="5"/></g>
    <rect x="20" y="404" width="380" height="34" rx="5" fill="#FFFFFF" stroke="#8A93A8" stroke-dasharray="4 3"/>
    <g font-weight="700">
      <text x="32" y="65">src/renderer</text><text x="32" y="105">src/servicios</text><text x="32" y="145">src/importacion</text><text x="32" y="185">src/ipc · main.ts · preload.ts</text><text x="32" y="225">src/db</text><text x="32" y="265">src/dominio · movil · tipos</text>
      <text x="32" y="305">movil/android</text><text x="32" y="345">pruebas</text><text x="32" y="385">scripts</text><text x="32" y="425" fill="#515C77">compatibilidad/main-anterior</text>
    </g>
    <g text-anchor="end" font-size="11.5" fill="#515C77">
      <text x="390" y="65">interfaz · 4 359 líneas</text><text x="390" y="105">negocio · 2 461 líneas</text><text x="390" y="145">ETL · 1 179 líneas</text><text x="390" y="185">arranque e IPC · 551 líneas</text><text x="390" y="225">esquema · 437 líneas</text><text x="390" y="265">reglas y contratos · 1 016 líneas</text>
      <text x="390" y="305">Kotlin · 644 líneas</text><text x="390" y="345">3 suites · 96 pruebas</text><text x="390" y="385">build, capturas, simulador</text><text x="390" y="425">versión anterior, no se empaqueta</text>
    </g>

    <!-- Escritorio -->
    <rect x="450" y="50" width="240" height="46" rx="6" fill="#FFFFFF" stroke="#16203A"/>
    <text x="570" y="78" text-anchor="middle" font-weight="700">src/ (TypeScript 5)</text>
    <rect x="450" y="150" width="240" height="46" rx="6" fill="#FFFFFF" stroke="#16203A"/>
    <text x="570" y="178" text-anchor="middle" font-weight="700">dist/ (JavaScript)</text>
    <rect x="450" y="250" width="240" height="62" rx="6" fill="#FCEBDD" stroke="#DE762E" stroke-width="1.5"/>
    <text x="570" y="270" text-anchor="middle" font-weight="700">release/ instaladores</text>
    <text x="570" y="288" text-anchor="middle" font-size="11" fill="#515C77">.exe NSIS · .exe portable</text>
    <text x="570" y="303" text-anchor="middle" font-size="11" fill="#515C77">.dmg · AppImage · .deb</text>

    <!-- Android -->
    <rect x="740" y="50" width="240" height="46" rx="6" fill="#FFFFFF" stroke="#16203A"/>
    <text x="860" y="78" text-anchor="middle" font-weight="700">movil/android (Kotlin)</text>
    <rect x="740" y="150" width="240" height="46" rx="6" fill="#172039"/>
    <text x="860" y="178" text-anchor="middle" font-weight="700" fill="#FFFFFF">PhoenixMobile.apk</text>

    <!-- Pruebas -->
    <rect x="740" y="250" width="240" height="62" rx="6" fill="#EEF0F5" stroke="#515C77"/>
    <text x="860" y="276" text-anchor="middle" font-weight="700">npm run prueba</text>
    <text x="860" y="294" text-anchor="middle" font-size="11" fill="#515C77">37 cargador + 58 negocio + 1 import.</text>

    <!-- GitHub -->
    <rect x="450" y="364" width="530" height="62" rx="6" fill="#FFFFFF" stroke="#515C77" stroke-dasharray="5 3"/>
    <text x="715" y="389" text-anchor="middle" font-weight="700">GitHub Actions · .github/workflows/instaladores.yml</text>
    <text x="715" y="408" text-anchor="middle" font-size="11" fill="#515C77">jobs: escritorio (Windows/macOS/Linux) · android · publicar (tag v*)</text>
  </g>

  <g stroke="#515C77" stroke-width="1.4" fill="none">
    <line x1="570" y1="96" x2="570" y2="147" marker-end="url(#f)"/>
    <line x1="570" y1="196" x2="570" y2="247" marker-end="url(#f)"/>
