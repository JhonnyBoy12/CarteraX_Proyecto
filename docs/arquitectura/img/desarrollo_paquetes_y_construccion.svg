    <line x1="570" y1="364" x2="570" y2="315" stroke-dasharray="4 3" marker-end="url(#f)"/>
    <path d="M980 395 H992 V173 H983" stroke-dasharray="4 3" marker-end="url(#f)"/>
  </g>
  <g font-size="11" fill="#515C77">
    <text x="578" y="120">npm run build</text><text x="578" y="135">tsc + copiar-assets</text>
    <text x="578" y="226">electron-builder</text>
    <text x="868" y="120">gradlew</text><text x="868" y="135">assembleDebug</text>
