<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Secuencia de la cola de llamadas: inicio con POST /call-status/ack y POST /call; sondeo cada 1,5 s que consulta GET /call-status; al terminar, confirmación con ack, registro de la gestión en SQLite y siguiente cliente." font-family="Archivo, Segoe UI, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#515C77"/></marker>
    <marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#DE762E"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#FFFFFF"/>
  <rect x="650" y="84" width="200" height="346" rx="6" fill="#FCEBDD" fill-opacity="0.6" stroke="#DE762E" stroke-dasharray="4 3"/>
  <text x="750" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#A9520F">HTTP :8765 (Wi-Fi)</text>
  <rect x="20" y="210" width="960" height="112" rx="6" fill="none" stroke="#8A93A8" stroke-dasharray="5 4"/>
  <text x="28" y="228" font-size="12" font-weight="700" fill="#515C77">bucle · cada 1,5 s</text>
  <g font-size="12" font-weight="700" fill="#515C77"><text x="28" y="128">inicio</text><text x="28" y="372">fin de llamada</text></g>

  <g font-size="13" text-anchor="middle">
    <rect x="30" y="20" width="200" height="56" rx="8" fill="#EEF0F5" stroke="#515C77"/>
    <text x="130" y="44" font-weight="700" fill="#16203A">Vista cola</text><text x="130" y="63" font-size="11.5" fill="#515C77">vista-cola.ts (renderer)</text>
    <rect x="280" y="20" width="200" height="56" rx="8" fill="#EEF0F5" stroke="#515C77"/>
    <text x="380" y="44" font-weight="700" fill="#16203A">Servicio de cola</text><text x="380" y="63" font-size="11.5" fill="#515C77">servicioColaLlamadas.ts</text>
    <rect x="530" y="20" width="200" height="56" rx="8" fill="#EEF0F5" stroke="#515C77"/>
    <text x="630" y="44" font-weight="700" fill="#16203A">Cliente móvil</text><text x="630" y="63" font-size="11.5" fill="#515C77">clienteMovil.ts</text>
    <rect x="770" y="20" width="200" height="56" rx="8" fill="#172039"/>
    <text x="870" y="44" font-weight="700" fill="#FFFFFF">Teléfono Android</text><text x="870" y="63" font-size="11.5" fill="#FCEBDD">MainActivity</text>
  </g>

  <g stroke="#8A93A8" stroke-width="1" stroke-dasharray="2 3">
    <line x1="130" y1="76" x2="130" y2="440"/><line x1="380" y1="76" x2="380" y2="440"/><line x1="630" y1="76" x2="630" y2="440"/><line x1="870" y1="76" x2="870" y2="440"/>
  </g>

  <g font-size="11.5" text-anchor="middle" fill="#16203A">
    <text x="255" y="122">cola:iniciar (IPC)</text>
    <text x="505" y="148">limpiar estado viejo</text>
    <text x="750" y="148" fill="#A9520F">POST /call-status/ack</text>
    <text x="505" y="184">llamar: siguiente cliente</text>
    <text x="750" y="184" fill="#A9520F">POST /call {phone}</text>
    <text x="255" y="252">cola:actualizar</text>
    <text x="505" y="278">leer estado de la llamada</text>
    <text x="750" y="278" fill="#A9520F">GET /call-status</text>
    <text x="750" y="306" fill="#A9520F">estado · contestó · duración</text>
    <text x="505" y="306">¿terminó?</text>
    <text x="505" y="362">confirmar recepción</text>
    <text x="750" y="362" fill="#A9520F">POST /call-status/ack</text>
    <text x="370" y="404" text-anchor="end">finalizarLlamada → SQLite</text>
  </g>

  <g stroke="#515C77" stroke-width="1.4" fill="none">
    <line x1="130" y1="130" x2="377" y2="130" marker-end="url(#f)"/>
    <line x1="380" y1="156" x2="627" y2="156" marker-end="url(#f)"/>
    <line x1="380" y1="192" x2="627" y2="192" marker-end="url(#f)"/>
    <line x1="130" y1="260" x2="377" y2="260" marker-end="url(#f)"/>
    <line x1="380" y1="286" x2="627" y2="286" marker-end="url(#f)"/>
    <line x1="630" y1="314" x2="383" y2="314" stroke-dasharray="5 3" marker-end="url(#f)"/>
    <line x1="380" y1="370" x2="627" y2="370" marker-end="url(#f)"/>
    <path d="M380 392 H420 V412 H383" marker-end="url(#f)"/>
  </g>
  <g stroke="#DE762E" stroke-width="1.8" fill="none">
    <line x1="630" y1="156" x2="867" y2="156" marker-end="url(#fn)"/>
    <line x1="630" y1="192" x2="867" y2="192" marker-end="url(#fn)"/>
    <line x1="630" y1="286" x2="867" y2="286" marker-end="url(#fn)"/>
    <line x1="870" y1="314" x2="633" y2="314" stroke-dasharray="5 3" marker-end="url(#fn)"/>
    <line x1="630" y1="370" x2="867" y2="370" marker-end="url(#fn)"/>
  </g>
  <text x="500" y="470" text-anchor="middle" font-size="12" fill="#515C77" font-family="Archivo, Segoe UI, sans-serif">↻ enviarSiguiente toma el siguiente cliente por prioridad y repite POST /call</text>
</svg>
