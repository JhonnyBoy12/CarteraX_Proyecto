<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" role="img" aria-label="Contexto del sistema: el ejecutivo usa CarteraX en su PC, que importa el Excel del banco, guarda todo en SQLite local, emite reportes y ordena llamadas a Phoenix Mobile por Wi-Fi; el teléfono llama al cliente por la red telefónica." font-family="Archivo, Segoe UI, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#515C77"/></marker>
    <marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#DE762E"/></marker>
  </defs>
  <rect x="0" y="0" width="1060" height="380" fill="#FFFFFF"/>

  <!-- Ejecutivo -->
  <rect x="30" y="140" width="160" height="72" rx="8" fill="#EEF0F5" stroke="#515C77" stroke-width="1"/>
  <text x="110" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#16203A">Ejecutivo de cobranza</text>
  <text x="110" y="190" text-anchor="middle" font-size="12" fill="#515C77">usuario principal</text>

  <!-- Entradas / salidas -->
  <rect x="290" y="22" width="140" height="52" rx="6" fill="#FFFFFF" stroke="#515C77" stroke-dasharray="4 3"/>
  <text x="360" y="44" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16203A">Cartera del banco</text>
  <text x="360" y="61" text-anchor="middle" font-size="11.5" fill="#515C77">Excel / CSV mensual</text>
  <rect x="450" y="22" width="140" height="52" rx="6" fill="#FFFFFF" stroke="#515C77" stroke-dasharray="4 3"/>
  <text x="520" y="44" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16203A">Reportes y respaldos</text>
  <text x="520" y="61" text-anchor="middle" font-size="11.5" fill="#515C77">xlsx · pdf · csv · .db</text>

  <!-- CarteraX -->
  <rect x="280" y="112" width="320" height="128" rx="10" fill="#FCEBDD" stroke="#DE762E" stroke-width="2"/>
  <text x="440" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#16203A">CarteraX Phoenix</text>
  <text x="440" y="172" text-anchor="middle" font-size="12.5" fill="#A9520F">Aplicación de escritorio v0.3.1</text>
  <text x="440" y="194" text-anchor="middle" font-size="12" fill="#515C77">Electron 31 · TypeScript · better-sqlite3</text>
  <text x="440" y="214" text-anchor="middle" font-size="12" fill="#515C77">Windows · macOS · Linux</text>

  <!-- SQLite -->
  <rect x="315" y="296" width="250" height="56" rx="6" fill="#EEF0F5" stroke="#515C77"/>
  <text x="440" y="319" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16203A">carterax_fusion.db</text>
  <text x="440" y="337" text-anchor="middle" font-size="11.5" fill="#515C77">SQLite local (%APPDATA%\CarteraX)</text>

  <!-- Phoenix Mobile -->
  <rect x="690" y="140" width="170" height="72" rx="8" fill="#172039"/>
  <text x="775" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Phoenix Mobile</text>
  <text x="775" y="190" text-anchor="middle" font-size="12" fill="#FCEBDD">App Android (Kotlin)</text>

  <!-- Cliente -->
  <rect x="910" y="140" width="130" height="72" rx="8" fill="#EEF0F5" stroke="#515C77"/>
  <text x="975" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#16203A">Cliente deudor</text>
  <text x="975" y="190" text-anchor="middle" font-size="12" fill="#515C77">titular de la deuda</text>

  <!-- Flechas -->
  <line x1="190" y1="176" x2="276" y2="176" stroke="#515C77" stroke-width="1.4" marker-end="url(#f)"/>
  <text x="233" y="166" text-anchor="middle" font-size="11.5" fill="#515C77">opera</text>
  <line x1="360" y1="74" x2="360" y2="108" stroke="#515C77" stroke-width="1.4" marker-end="url(#f)"/>
  <text x="352" y="96" text-anchor="end" font-size="11.5" fill="#515C77">importa</text>
  <line x1="520" y1="112" x2="520" y2="78" stroke="#515C77" stroke-width="1.4" marker-end="url(#f)"/>
  <text x="528" y="96" font-size="11.5" fill="#515C77">exporta</text>
  <line x1="440" y1="240" x2="440" y2="292" stroke="#515C77" stroke-width="1.4" marker-end="url(#f)" marker-start="url(#f)"/>
  <text x="448" y="270" font-size="11.5" fill="#515C77">lee / escribe (síncrono)</text>
  <line x1="600" y1="168" x2="686" y2="168" stroke="#DE762E" stroke-width="1.8" marker-end="url(#fn)"/>
  <line x1="686" y1="188" x2="604" y2="188" stroke="#DE762E" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#fn)"/>
  <text x="643" y="158" text-anchor="middle" font-size="11.5" fill="#A9520F">HTTP :8765</text>
  <text x="643" y="206" text-anchor="middle" font-size="11.5" fill="#A9520F">Wi-Fi local</text>
  <line x1="860" y1="176" x2="906" y2="176" stroke="#515C77" stroke-width="1.4" marker-end="url(#f)"/>
  <text x="883" y="166" text-anchor="middle" font-size="11.5" fill="#515C77">llama</text>
  <text x="883" y="194" text-anchor="middle" font-size="11" fill="#515C77">red móvil</text>
</svg>
